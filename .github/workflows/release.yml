name: Deploy Lotus Pond Reader

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Version and Build Date into Android App
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DATE=$(date +"%B %d, %Y")
          sed -i "s/Version [0-9]*\.[0-9]*\.[0-9]* · Published [A-Za-z0-9, ]*/Version ${VERSION} · Published ${BUILD_DATE}/g" android/app/src/main/java/com/example/lotuspondreader/ui/screens/SettingsScreen.kt
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION}\"/g" android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotus-pond-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Version and Build Date into Web App
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_DATE=$(date +"%B %d, %Y")
          sed -i "s/Version [0-9]*\.[0-9]*\.[0-9]* · Published [A-Za-z0-9, ]*/Version ${VERSION} · Published ${BUILD_DATE}/g" web/index.html

      - name: Push Web Assets to sanbeiji.github.io
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          mkdir deploy_workspace
          cd deploy_workspace
          git clone https://sanbeiji:${WEB_DEPLOY_TOKEN}@github.com/sanbeiji/sanbeiji.github.io.git .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/lotus
          cp -r ../web/* docs/lotus/
          git add docs/lotus/
          git commit -m "Continuous Integration: Sync Lotus Pond Reader web release" || true
          git push origin main

  create-release:
    needs: [build-android, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: lotus-pond-apk
          path: ./downloaded-apk
        continue-on-error: true

      - name: Extract Commit History for Release Notes
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..HEAD > release_notes.md

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            ./downloaded-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}